  cadastro-defesa-civil: |
    - [marcar: cad-bh] Em BH, a Defesa Civil também atende no WhatsApp: procure por "defesacivilbh". O telefone é **199**. [fonte: pbh-periodo-chuvoso-2026-2027]
  defesa-civil-local: |
    - **Defesa Civil de BH:** [**199**](tel:199), 24 horas. No WhatsApp, procure por "defesacivilbh". [fonte: pbh-periodo-chuvoso-2026-2027]
  deslizamento-local: |
    Em BH, o **Disque Vistoria** é o (31) 3277-6409, em horário comercial; fora dele, ligue 199. [fonte: pbh-urbel-dicas-periodo-chuvoso-2026]
  hospitais: |
    ### Onde ser atendido em BH

    - **Sintoma grave** (falta de ar forte, dor no peito, convulsão, suspeita de fratura): **UPA**, aberta 24 horas. [fonte: pbh-sintomas-leves-2026]
    - **Sintoma leve**, receita, vacina: **centro de saúde**, de segunda a sexta. [fonte: pbh-sintomas-leves-2026]
    - Não dá para levar a pessoa: [**192**](tel:192) (SAMU). [fonte: pbh-urgencia-emergencia]

    **Hospitais com pronto-socorro 24 horas:**

    - **João XXIII:** acidente grave, queimadura grave, fratura, picada de bicho peçonhento e intoxicação, também em criança. Av. Prof. Alfredo Balena, 400, Santa Efigênia. [(31) 3239-9200](tel:3132399200) · [Abrir no mapa](mapa:Av.%20Professor%20Alfredo%20Balena%2C%20400%2C%20Belo%20Horizonte%20-%20MG) [fonte: fhemig-joao-xxiii]
    - **Infantil João Paulo II:** pronto atendimento de crianças. Alameda Ezequiel Dias, 345, Santa Efigênia. [(31) 3239-9050](tel:3132399050) · [Abrir no mapa](mapa:Alameda%20Ezequiel%20Dias%2C%20345%2C%20Belo%20Horizonte%20-%20MG) [fonte: fhemig-joao-paulo-ii]
    - **Odilon Behrens:** pronto-socorro de trauma, cirurgia, gravidez e parto e crianças. Bairro São Cristóvão. [(31) 3277-6198](tel:3132776198) · [Abrir no mapa](mapa:Hospital%20Metropolitano%20Odilon%20Behrens%2C%20Belo%20Horizonte%20-%20MG) [fonte: pbh-hob-perguntas-frequentes]
    - **Risoleta Tolentino Neves:** porta aberta 24 horas. Rua das Gabirobas, 1, Vila Clóris. [(31) 3459-3200](tel:3134593200) · [Abrir no mapa](mapa:Rua%20das%20Gabirobas%2C%201%2C%20Belo%20Horizonte%20-%20MG) [fonte: hrtn-site]
    - **Maternidade Odete Valadares:** urgência na gravidez e ginecológica, e atendimento a vítima de violência sexual. Av. do Contorno, 9330, Barro Preto. [(31) 3298-6000](tel:3132986000) · [Abrir no mapa](mapa:Avenida%20do%20Contorno%2C%209330%2C%20Belo%20Horizonte%20-%20MG) [fonte: fhemig-odete-valadares]

