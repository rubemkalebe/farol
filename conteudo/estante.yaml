# Manuais para recomeçar: PDFs gratuitos de órgãos públicos e instituições
# reconhecidas. O Farol não guarda nem altera os arquivos: o app baixa cada
# um do endereço de quem publicou. Cada item traz a licença ou o aviso de
# reprodução como está no manual ou no repositório (conferido em 2026-11-23).
#
# Embrapa (Infoteca-e): os PDFs dizem "Todos os direitos reservados" e o
# repositório diz CC BY-NC-ND 4.0; baixar do próprio site da Embrapa, sem
# copiar nem alterar, cabe nos dois.
