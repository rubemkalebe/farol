      p.208-209 RCP adulto: "30:2"; "5 a 6 cm de profundidade"; "100 a 120 compressões por minuto"; DEA "assim que disponível"; "Durante a análise do ritmo, não toque no paciente"; no choque, todos afastados.
      p.203-204 engasgo adulto: "ciclos repetidos de 5 golpes nas costas, seguidos de 5 compressões abdominais"; obesos e gestantes no último trimestre: mãos sobre o esterno; inconsciente: 30 compressões e retirar o objeto só se visível.
      p.379-381 engasgo criança: bebê 5 golpes entre as escápulas + "5 compressões torácicas com a base de uma mão"; >1 ano 5 golpes + 5 compressões abdominais.
      p.267-268 AVC (BE FAST): face (sorrir), braços (levantar os dois), fala (repetir frase), tempo (hora em que foi vista normal pela última vez).

  - id: aha-2025-highlights
    tema: rcp
    titulo: "Highlights of the 2025 American Heart Association Guidelines for CPR and ECC (Heart and Stroke Foundation of Canada Edition)"
    orgao: American Heart Association / Heart and Stroke Foundation of Canada
