      p.11: bebê, "heel of 1 hand or using the 2 thumb–encircling hands technique"; "The long-used 2-finger technique for infant CPR is no longer recommended."
      p.11-12: criança engasgada, "5 back blows alternated with 5 abdominal thrusts"; bebê, "5 back blows alternating with 5 chest thrusts"; "Abdominal thrusts are not recommended for infants".
      p.12-13: adulto engasgado, "5 back blows (slaps) followed by 5 abdominal thrusts"; golpes nas costas tiveram mais sucesso e menos lesões.
      p.14: gestação avançada ou quando não dá para abraçar o abdome: "5 chest thrusts" no lugar das abdominais.

