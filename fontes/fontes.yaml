      "Entre 12 e 20% - Estado de Alerta": suprimir exercício e trabalho ao ar livre entre 10 e 16 h; evitar aglomeração em lugar fechado; soro nos olhos e narinas.
      "Abaixo de 12% - Estado de emergência": interromper atividade ao ar livre entre 10 e 16 h; manter quartos de crianças úmidos.

