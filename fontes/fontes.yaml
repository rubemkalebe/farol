    usado_em: [outros-desastres]
    notas: |
      Transmitida pela urina de animais, principalmente ratos; sintomas normalmente de 7 a 14 dias após a exposição (até 30).
      Sintomas: febre, falta de apetite, dor muscular (principalmente nas panturrilhas), dor de cabeça, náusea e vômito. Procurar o serviço de saúde e contar da exposição; não se automedicar.
      "Evitar o contato com água ou lama de enchentes e impedir que crianças nadem ou brinquem nessas águas."
      Limpeza: "para 20 litros de água, adicionar duas xícaras de chá (400mL) de hipoclorito de sódio a 2,5%", deixar agir 15 minutos; botas de borracha e luvas.

