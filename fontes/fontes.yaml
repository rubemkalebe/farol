  # ───────────── RCP, engasgo, emergências clínicas ─────────────

  - id: sbc-diretriz-rcp-2019
    tema: rcp
    titulo: "Atualização da Diretriz de Ressuscitação Cardiopulmonar e Cuidados Cardiovasculares de Emergência da Sociedade Brasileira de Cardiologia – 2019"
    orgao: Sociedade Brasileira de Cardiologia (Arq Bras Cardiol. 2019; 113(3):449-663)
    url: https://abccardiol.org/wp-content/uploads/articles_xml/0066-782X-abc-113-03-0449/0066-782X-abc-113-03-0449.x66747.pdf
    acessado: 2026-11-22
    publicado: 2019
    licenca: "artigo de acesso aberto, licença Creative Commons de atribuição (p. 663)"
    redistribuir: sim
    usado_em: [primeiros-socorros]
    notas: |
      Páginas da revista.
      RCP adulto, p.461: "100 a 120 compressões/minuto"; "profundidade de, no mínimo, 5 cm (evitando compressões com profundidade maior que 6 cm)"; "Permita o retorno completo do tórax"; "Reveze com outro socorrista a cada 2 minutos".
      p.469: leigo liga imediatamente se a vítima não responde; sozinho, celular no "viva-voz"; treinado faz 30:2; "O leigo não treinado deve realizar compressões torácicas contínuas".
      p.551 pediatria: lactente "um terço do diâmetro anteroposterior ou aproximadamente de 4 cm"; criança "aproximadamente 5 cm"; ventilação recomendada em crianças.
      p.555: leigo "não checa o pulso"; 30:2 para todas as idades; sem saber ventilar, só compressões.
      p.608: inconsciente → chamar socorro e pedir DEA; olhar a respiração por 5 a 10 s; sem respiração ou "gasping", iniciar RCP.
      Engasgo, p.555: bebê "cinco golpes nas costas e cinco compressões torácicas"; >1 ano Heimlich; criança obesa: compressões torácicas.
      p.610: engasgo leve → "encorajar a vítima a persistir na tosse"; grave → "Incapacidade de respirar, tossir e falar, cianose", "sinal universal da asfixia"; grávida ou obesa → compressões torácicas; ficou inconsciente → deitar no chão, chamar socorro e iniciar RCP; tirar o objeto só se visível, sem "varredura digital às cegas"; todo engasgado que recebeu Heimlich "deve ser encaminhada para o hospital".
      Desmaio, p.609: deitar de costas e esperar recuperar; se não recuperar, chamar socorro; elevar as pernas, exceto em trauma.
      Infarto, p.611: dor no peito "> 10 minutos", "em aperto, peso ou queimação", irradiando para braços, costas, pescoço ou mandíbula, com falta de ar, suor, náusea, vômito, tontura; sintomas atípicos em "mulheres, idosos e diabéticos". AAS 200 mg mastigado se não houver contraindicação (alergia ou sangramento).
      AVC, p.611-612: reconhecer cedo e ligar 192; Cincinnati: "desvio de rima labial, fraqueza em um dos membros superiores e anormalidades na fala" — qualquer um dos três já indica AVC provável; carro particular atrasa o atendimento.
      Convulsão, p.613-614: calma; local seguro; algo macio sob a cabeça; de lado; ficar junto; ">5 minutos sem sinais de melhora, peça ajuda médica". Não segurar, "Não coloque a mão dentro da boca", "Não jogue água". Depois: ver a respiração e posição de recuperação.

