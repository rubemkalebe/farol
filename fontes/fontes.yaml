      Não usar máscara de uma alça ou com elásticos nas orelhas, que não vedam; barba impede a vedação; respiradores não servem em crianças pequenas.
      Cardíacos, pneumopatas e grávidas: perguntar ao médico antes de usar respirador. No calor, a máscara aumenta o risco: pausas e água.

