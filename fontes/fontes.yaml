  # ───────────── Hipoglicemia ─────────────

  - id: sbd-orientacoes-hipoglicemia-2023
    tema: hipoglicemia
    titulo: "Orientações sobre hipoglicemia para profissionais de saúde"
    orgao: Sociedade Brasileira de Diabetes (Departamento de Enfermagem)
    url: https://diabetes.org.br/wp-content/uploads/2023/09/Orientacoes_Hipoglicemia_SBD.pdf
    acessado: 2026-11-22
    publicado: 2023
    licenca: desconhecida
    redistribuir: verificar
    usado_em: [primeiros-socorros]
    notas: |
      p.1: hipoglicemia é glicose "inferior a 70 mg/dL"; sem como medir, tratar com carboidrato de rápida absorção imediatamente.
      p.1-2 sintomas: "sudorese, fome, visão turva, taquicardia, tremores, palidez, cefaleia, desânimo, incoordenação motora, sonolência, alterações de humor, sensação de desmaio, perda da consciência, convulsão, coma"
      p.7: "regra dos 15: ingerir 15 g de carboidrato de rápida absorção, aguardar 15 minutos em repouso, medir novamente a glicose, fazer um lanche ou adiantar a refeição do horário. Se necessário, repetir"
      p.10: 15 g = "uma colher de sopa de açúcar misturada em meio copo de água ou 3 balas moles ou uma colher de sopa de mel ou 150 ml de refrigerante comum ou um copo de suco integral de laranja ou um sachê de glicose instantânea"
      p.10 nível 3: "em caso de rebaixamento do nível de consciência, colocar a pessoa em posição de conforto, lateralizar a cabeça e se possível, esfregar 15 a 30 gramas de açúcar ou mel na face interna da bochecha cautelosamente, enquanto aguarda o serviço de emergência"
      p.10: glucagon se disponível, "conforme orientação médica". Carboidrato "isoladamente, sem associar fibras, gorduras ou proteínas"; refeição em até 1 hora.

