    redistribuir: sim
    usado_em: [outros-desastres]
    notas: |
      Sintomas: "Dores de cabeça. Irritação e ardência nos olhos, nariz e garganta. Rouquidão. Lacrimejamento. Tosse seca. Dificuldade de respirar. Cansaço."
      Água ajuda a manter as vias respiratórias úmidas; evitar exercício ao ar livre com fumaça; comida sem fritura nem grelha.
      Máscaras comuns dão "pouca ou nenhuma proteção" contra partículas de fumaça; só N95, PFF2 ou P100.
      Ar-condicionado em recirculação; evitar aspirador sem filtro HEPA.
      Menores de 5 anos, maiores de 60 e gestantes: procurar atendimento cedo. Cardíacos e respiratórios: ter os remédios de crise à mão.
      Prevenção: aceiros; "Não soltar balões ou fogos de artifícios."; "Não acender fogueiras."

  - id: epa-protect-lungs-smoke
