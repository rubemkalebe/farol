      "O essencial é tomar água com frequência."; urina "transparente".
      "Umidificar o ambiente com toalhas molhadas, em especial no quarto de dormir"; evitar exercício ao ar livre "entre 10h às 16h".
      Soro fisiológico nas narinas; colírio lubrificante. Crianças e idosos mais vulneráveis.
      Pele muito seca, pouca urina, cansaço intenso, sonolência ou confusão: Centro de Saúde.

